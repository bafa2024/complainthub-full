server {
  listen 80;
  server_name localhost;

  # Set the root directory for serving files
  root /usr/share/nginx/html;
  index index.html index.htm;

  # This is the crucial part for single-page applications like React
  # It ensures that any request that doesn't match a file is sent to index.html,
  # allowing React Router to handle the URL.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: Improve caching for static assets
  location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
}