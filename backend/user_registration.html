<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Complaint Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            font-size: 16px; /* Prevents zoom on iOS */
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px; /* Prevents zoom on iOS */
            transition: border-color 0.3s ease;
            min-height: 44px; /* Touch target */
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            min-height: 48px; /* Touch target */
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result pre {
            background: rgba(0, 0, 0, 0.1);
            padding: 0.75rem;
            border-radius: 4px;
            overflow-x: auto;
            margin-top: 0.75rem;
            font-size: 0.875rem;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1.5rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.75rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid #667eea;
        }

        .api-info h3 {
            color: #2c3e50;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .api-info p {
            color: #6c757d;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .api-info code {
            background: #e9ecef;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }

        /* Responsive Design - Mobile First */
        
        /* Small devices (576px and up) */
        @media (min-width: 576px) {
            body {
                padding: 1.5rem;
            }
            
            .container {
                padding: 2rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .form-group input,
            .form-group select {
                padding: 0.875rem;
            }
            
            .submit-btn {
                padding: 1.125rem;
                font-size: 1.1rem;
            }
        }

        /* Medium devices (768px and up) */
        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }
            
            .container {
                padding: 2.5rem;
                max-width: 600px;
            }
            
            .header h1 {
                font-size: 2.25rem;
            }
            
            .form-group {
                margin-bottom: 2rem;
            }
            
            .form-group input,
            .form-group select {
                padding: 1rem;
            }
            
            .submit-btn {
                padding: 1.25rem;
                font-size: 1.125rem;
            }
        }

        /* Large devices (992px and up) */
        @media (min-width: 992px) {
            .container {
                padding: 3rem;
                max-width: 700px;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .form-group input,
            .form-group select {
                padding: 1.125rem;
            }
            
            .submit-btn {
                padding: 1.5rem;
                font-size: 1.25rem;
            }
        }

        /* Mobile-specific improvements */
        @media (max-width: 575px) {
            body {
                padding: 0.5rem;
            }
            
            .container {
                padding: 1rem;
                border-radius: 12px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .header p {
                font-size: 0.875rem;
            }
            
            .form-group {
                margin-bottom: 1rem;
            }
            
            .form-group input,
            .form-group select {
                padding: 0.75rem;
                font-size: 16px;
            }
            
            .submit-btn {
                padding: 0.875rem;
                font-size: 1rem;
                min-height: 48px;
            }
            
            .api-info {
                padding: 0.75rem;
                margin-bottom: 1rem;
            }
            
            .api-info h3 {
                font-size: 0.9rem;
            }
            
            .api-info p {
                font-size: 0.8rem;
            }
        }

        /* Touch target improvements for mobile */
        @media (max-width: 768px) {
            .form-group input,
            .form-group select {
                min-height: 48px;
            }
            
            .submit-btn {
                min-height: 52px;
            }
        }

        /* Accessibility improvements */
        @media (prefers-reduced-motion: reduce) {
            .submit-btn,
            .form-group input,
            .form-group select {
                transition: none;
            }
            
            .submit-btn:hover {
                transform: none;
            }
            
            .spinner {
                animation: none;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .container {
                border: 2px solid #000;
            }
            
            .form-group input,
            .form-group select {
                border-width: 2px;
            }
            
            .submit-btn {
                border: 2px solid #000;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            }
            
            .container {
                background: #2d2d2d;
                color: #fff;
            }
            
            .header h1 {
                color: #fff;
            }
            
            .header p {
                color: #ccc;
            }
            
            .form-group label {
                color: #fff;
            }
            
            .form-group input,
            .form-group select {
                background: #1a1a1a;
                color: #fff;
                border-color: #666;
            }
            
            .form-group input:focus,
            .form-group select:focus {
                border-color: #667eea;
            }
            
            .api-info {
                background: #1a1a1a;
                color: #fff;
            }
            
            .api-info h3 {
                color: #fff;
            }
            
            .api-info p {
                color: #ccc;
            }
            
            .api-info code {
                background: #333;
                color: #fff;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 User Registration</h1>
            <p>Test the user registration API</p>
        </div>

        <div class="api-info">
            <h3>API Endpoint</h3>
            <p><strong>URL:</strong> <code>http://127.0.0.1:8000/api/v1/users/</code></p>
            <p><strong>Method:</strong> <code>POST</code></p>
            <p><strong>Content-Type:</strong> <code>application/json</code></p>
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
                <div class="error-message" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required minlength="6">
                <div class="error-message" id="password-error"></div>
            </div>

            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name">
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" placeholder="+1234567890">
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="user">User</option>
                    <option value="brand_user">Brand User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Register User
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Registering user...</p>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + '-error');
            field.classList.add('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function clearError(fieldId) {
            const field = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + '-error');
            field.classList.remove('error');
            errorDiv.style.display = 'none';
        }

        function showResult(success, message, data = null) {
            result.className = `result ${success ? 'success' : 'error'}`;
            result.style.display = 'block';
            
            let content = `<strong>${success ? 'Success!' : 'Error!'}</strong><br>${message}`;
            
            if (data) {
                content += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            }
            
            result.innerHTML = content;
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            loading.style.display = isLoading ? 'block' : 'none';
            result.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            clearError('email');
            clearError('password');
            
            // Get form data
            const formData = new FormData(form);
            const userData = {
                email: formData.get('email'),
                password: formData.get('password'),
                full_name: formData.get('full_name') || null,
                phone_number: formData.get('phone_number') || null,
                role: formData.get('role')
            };

            // Basic validation
            if (!userData.email) {
                showError('email', 'Email is required');
                return;
            }

            if (!userData.password || userData.password.length < 6) {
                showError('password', 'Password must be at least 6 characters');
                return;
            }

            setLoading(true);

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/users/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(true, 'User registered successfully!', data);
                    form.reset();
                } else {
                    showResult(false, data.detail || 'Registration failed', data);
                }
            } catch (error) {
                console.error('Error:', error);
                showResult(false, 'Network error: ' + error.message);
            } finally {
                setLoading(false);
            }
        });

        // Clear errors when user starts typing
        document.getElementById('email').addEventListener('input', () => clearError('email'));
        document.getElementById('password').addEventListener('input', () => clearError('password'));
    </script>
</body>
</html>
